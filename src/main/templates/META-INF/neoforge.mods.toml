modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mixins]]
config="${mod_id}.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Sange"
description='''
TACZ: Art of Sniping (TACZ: AoS) — a long-range sniping extension for TACZ on Minecraft 1.21.1 NeoForge.
Designed for scoped sniper rifles, with optional NeoVoxy distant-terrain integration.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="iris"
type="optional"
versionRange="[1.8.0,1.9)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="tacz"
type="required"
versionRange="${tacz_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="voxy"
type="optional"
versionRange="${voxy_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="parcool"
type="optional"
# Omit versionRange: NeoForge defaults to UNBOUNDED.
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="crawlondemand"
type="optional"
# Omit versionRange; the optional API bridge fails safely if a future API changes.
ordering="AFTER"
side="BOTH"

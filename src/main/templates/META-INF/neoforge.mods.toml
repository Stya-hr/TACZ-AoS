modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mixins]]
config="${mod_id}.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="assets/tacz_aos/logo.png"
authors="Sange"
description="A TACZ addon with realistic ballistics and tactical equipment that allows players to snipe other entities from extreme distances."

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="iris"
type="optional"
versionRange="[1.8.0,1.9)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="tacz"
type="required"
versionRange="${tacz_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="voxy"
type="optional"
versionRange="${voxy_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="parcool"
type="optional"
# Omit versionRange: NeoForge defaults to UNBOUNDED.
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="crawlondemand"
type="optional"
# Omit versionRange; the optional API bridge fails safely if a future API changes.
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="curios"
type="optional"
versionRange="[9.5.1,10.0.0)"
ordering="AFTER"
side="BOTH"

plugins {
    id 'java-library'
    id 'dev.architectury.loom' version '1.6.422'
    id 'maven-publish'
}
version = mod_version
group = mod_group_id
base { archivesName = "${mod_id}-forge-${minecraft_version}" }
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.blamejared.com/' }
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}
sourceSets {
    main.resources { srcDir 'src/generated/resources'; exclude '**/*.bbmodel', '**/.cache/**' }
    gameTest { compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath; runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath }
}
configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestCompileOnly.extendsFrom compileOnly
    gameTestRuntimeOnly.extendsFrom runtimeOnly
    taczBundledApi { transitive = false }
}
loom {
    silentMojangMappingsLicense()
    forge { mixinConfigs = ['tacz_aos.mixins.json'] }
    mixin.defaultRefmapName = 'tacz_aos.refmap.json'
    runs {
        client { client(); runDir 'run/client' }
        server { server(); runDir 'run/server'; programArgs '--nogui' }
        clientScopeTest {
            client(); source sourceSets.gameTest; runDir 'build/client-forge-scope-test'
            property 'tacz_aos.clientScopeTest', 'true'
            property 'tacz_aos.proneSwayOnly', providers.gradleProperty('prone_sway_test_only').orElse('false').get()
            property 'tacz_aos.environmentHudOnly', providers.gradleProperty('environment_hud_test_only').orElse('false').get()
            programArgs '--width', '960', '--height', '540'
        }
        clientLongRangeTest {
            client(); source sourceSets.gameTest; runDir 'build/client-forge-long-range-test'
            property 'tacz_aos.longRangeTest', 'true'
            programArgs '--width', '960', '--height', '540'
        }
        gameTestServer {
            environment 'gameTestServer'; forgeTemplate 'gameTestServer'; name 'Game Test'; source sourceSets.gameTest
            runDir 'build/gametest-forge'
            property 'forge.enabledGameTestNamespaces', providers.gradleProperty('gametest_namespaces').orElse(project.mod_id).get()
            property 'forge.gameTestServer', 'true'
        }
    }
    mods { tacz_aos { sourceSet sourceSets.main; sourceSet sourceSets.gameTest } }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    forge "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    modImplementation("maven.modrinth:timeless-and-classics-zero:${tacz_version}") { transitive = false }
    taczBundledApi("maven.modrinth:timeless-and-classics-zero:${tacz_version}") { transitive = false }
    modCompileOnly files("libs/${voxy_jar}")
    modCompileOnly("maven.modrinth:curios:${curios_version}") { transitive = false }
    modCompileOnly("maven.modrinth:lightmans-currency:${lightmans_currency_version}") { transitive = false }
    modCompileOnly("maven.modrinth:collectors-album:${collectors_album_version}") { transitive = false }
    modCompileOnly("maven.modrinth:champions-unofficial:${champions_unofficial_version}") { transitive = false }
    modCompileOnly("maven.modrinth:touhou-little-maid:${touhou_little_maid_version}") { transitive = false }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.4'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.5.4'
    include implementation('io.github.llamalad7:mixinextras-forge:0.5.4')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
    if (providers.gradleProperty('enable_voxy_runtime').get().toBoolean()) {
        modRuntimeOnly files("libs/${voxy_jar}")
        forgeRuntimeLibrary files(zipTree(file("libs/${voxy_jar}")).matching {
            include 'META-INF/jars/*.jar'; exclude 'META-INF/jars/mixinextras-*.jar'
        })
        modRuntimeOnly("maven.modrinth:embeddium:${embeddium_version}") { transitive = false }
    }
    if (providers.gradleProperty('enable_maid_compat_runtime').orElse('false').get().toBoolean()) {
        modRuntimeOnly("maven.modrinth:touhou-little-maid:${touhou_little_maid_version}") { transitive = false }
    }
    if (providers.gradleProperty('enable_prone_compat_runtime').orElse('false').get().toBoolean()) {
        modRuntimeOnly('maven.modrinth:parcool:uEY441aP') { transitive = false }
        modRuntimeOnly('maven.modrinth:crawl-on-demand:vYF9TsDY') { transitive = false }
    }
    if (providers.gradleProperty('enable_curios_runtime').orElse('false').get().toBoolean()) {
        modRuntimeOnly("maven.modrinth:curios:${curios_version}") { transitive = false }
    }
    if (providers.gradleProperty('enable_loot_compat_runtime').orElse('false').get().toBoolean()) {
        modRuntimeOnly("maven.modrinth:lightmans-currency:${lightmans_currency_version}") { transitive = false }
        modRuntimeOnly("maven.modrinth:collectors-album:${collectors_album_version}") { transitive = false }
        modRuntimeOnly("maven.modrinth:champions-unofficial:${champions_unofficial_version}") { transitive = false }
        modRuntimeOnly('maven.modrinth:configuration:h7CBg2Oe') { transitive = false }
        modRuntimeOnly('maven.modrinth:architectury-api:1MKTLiiG') { transitive = false }
        // Champions 2.1.10.2 eagerly links its KubeJS integration during common setup.
        modRuntimeOnly('maven.modrinth:kubejs:hVR2xUSr') { transitive = false }
        modRuntimeOnly('maven.modrinth:rhino:uNALdylI') { transitive = false }
    }
}
// Do not resolve TACZ while evaluating the build script. Loom still needs to configure
// exclusive LWJGL repositories (notably when Gradle runs on Java 19+).
def taczBundledContents = providers.provider { zipTree(configurations.taczBundledApi.singleFile) }
def taczBedrockLibrary = taczBundledContents.map { contents ->
    contents.matching { include 'META-INF/jarjar/simplebedrockmodel-*.jar' }
}
def extractTaczLuaApi = tasks.register('extractTaczLuaApi', Sync) {
    from(taczBundledContents) { include 'META-INF/jarjar/luaj-*.jar' }
    into layout.buildDirectory.dir('tacz-lua-api-forge')
}
dependencies {
    compileOnly files(fileTree(layout.buildDirectory.dir('tacz-lua-api-forge')) { include '**/*.jar' }).builtBy(extractTaczLuaApi)
    // Loom removes jar-in-jar metadata when remapping mods. Supply TACZ's original bundled libraries in dev runs.
    modImplementation files(taczBedrockLibrary)
    forgeRuntimeLibrary files(taczBedrockLibrary.map { libraries ->
        zipTree(libraries.singleFile).matching { include 'META-INF/jarjar/*.jar' }
    })
    forgeRuntimeLibrary files(taczBundledContents.map { contents ->
        contents.matching {
            include 'META-INF/jarjar/luaj-*.jar', 'META-INF/jarjar/commons-math3-*.jar', 'META-INF/jarjar/bcel-*.jar'
        }
    })
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17; options.fork = false }
tasks.named('test', Test) { useJUnitPlatform() }
tasks.named('jar', Jar) { from('LICENSE', 'TEMPLATE_LICENSE.txt') }
tasks.named('processGameTestResources', ProcessResources) {
    from('src/gameTest/resources/data/tacz_aos/structures/ballistics.nbt') { into 'data/tacz_aos_lootcompat/structures' }
}
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def values = ['minecraft_version_range', 'forge_version', 'loader_version_range', 'mod_id', 'mod_name', 'mod_license', 'mod_version', 'tacz_version_range', 'voxy_version_range'].collectEntries { [(it): project.property(it)] }
    inputs.properties values
    expand values
    from 'src/main/templates'
    into 'build/generated/sources/modMetadataForge'
}
sourceSets.main.resources.srcDir generateModMetadata
// Loom lowercases DLI environment names, whereas Forge's userdev template uses "gameTestServer".
tasks.named('generateDLIConfig').configure {
    doLast {
        def config = loom.files.devLauncherConfig
        config.text = config.text.replace('gameTestServerProperties', 'gametestserverProperties')
                .replace('gameTestServerArgs', 'gametestserverArgs')
    }
}
tasks.named('runGameTestServer').configure {
    doFirst {
        // GameTest entities/chunks from a failed run must not contaminate the next run.
        def testWorld = file('build/gametest-forge/world').canonicalFile.toPath()
        if (!testWorld.startsWith(layout.buildDirectory.get().asFile.canonicalFile.toPath()))
            throw new GradleException('Refusing to reset a test world outside build/')
        delete testWorld.toFile()
    }
    doLast {
        def log = file('build/gametest-forge/logs/latest.log')
        if (!log.isFile() || !(log.text =~ /All \d+ required tests passed/).find())
            throw new GradleException('Forge GameTest did not report a passing test suite; inspect build/gametest-forge/logs/latest.log')
    }
}
publishing { publications { mavenJava(MavenPublication) { artifact tasks.remapJar } } }

['runClientScopeTest': ['client-forge-scope-test', 'scope-result.txt'],
 'runClientLongRangeTest': ['client-forge-long-range-test', 'result.txt']].each { taskName, result ->
    tasks.named(taskName).configure {
        doFirst { delete layout.buildDirectory.file("${result[0]}/${result[1]}") }
        doLast {
            def outcome = layout.buildDirectory.file("${result[0]}/${result[1]}").get().asFile
            if (!outcome.isFile() || outcome.text.trim() != 'PASS')
                throw new GradleException("Client integration test failed: ${outcome}")
        }
    }
}

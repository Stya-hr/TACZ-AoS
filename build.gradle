plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

repositories {
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/*.bbmodel', '**/.cache/**'
}

// Kept out of the published JAR; included only in development runs.
sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations.gameTestImplementation.extendsFrom configurations.implementation

neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.gameTest
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client { client() }
        clientScopeTest {
            client()
            gameDirectory = file('build/client-scope-test')
            systemProperty 'taczlrs.clientScopeTest', 'true'
            programArguments.addAll '--width', '960', '--height', '540'
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('build/gametest')
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output',
                    file('src/generated/resources/').getAbsolutePath(), '--existing',
                    file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gameTest)
        }
    }
}

// Development-only runtime dependencies are not published to consumers.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation "maven.modrinth:tacz-1.21.1:${tacz_version}"
    compileOnly files("libs/${voxy_jar}")
    // NeoVoxy also requires Sodium on the client; see libs/README.md.
    if (providers.gradleProperty('enable_voxy_runtime').get().toBoolean()) {
        if (!file("libs/${voxy_jar}").isFile()) {
            throw new GradleException("Missing libs/${voxy_jar}; see libs/README.md before enabling NeoVoxy.")
        }
        localRuntime files("libs/${voxy_jar}")
    }
}

tasks.named('test', Test).configure { useJUnitPlatform() }

tasks.named('runClientScopeTest').configure {
    def result = layout.projectDirectory.file('build/client-scope-test/scope-result.txt').asFile
    doFirst {
        result.parentFile.mkdirs()
        result.text = 'RUNNING'
    }
    doLast {
        if (result.text.trim() != 'PASS') {
            throw new GradleException('Client scope integration did not report PASS; inspect build/client-scope-test/logs/latest.log')
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version: neo_version,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            tacz_version_range: tacz_version_range,
            voxy_version_range: voxy_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) { from components.java }
    }
    repositories {
        maven { url = layout.projectDirectory.dir('repo').asFile.toURI() }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

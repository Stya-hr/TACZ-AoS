name: Build Forge 1.20.1 (TaCZ 1.1.7)

on:
  push:
    branches:
      - 'forge/1.20.1'
  pull_request:
    branches:
      - 'forge/1.20.1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Build AoS
        run: ./gradlew build --stacktrace -Penable_voxy_runtime=false
      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tacz-aos-forge-1.20.1-tacz117
          path: build/libs/*.jar
          if-no-files-found: error
